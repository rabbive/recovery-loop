# Render blueprint for the public demo instance.
#
# The free plan sleeps a service after 15 minutes without traffic and takes about a minute to wake,
# so the app publishes the seeded batch on start (see `publishSeededBatchIfMissing` in
# src/server.ts). A visitor arriving at a cold instance therefore waits, but then sees figures
# rather than an empty dashboard.
#
# Razorpay credentials are deliberately absent. Without them the app runs the deterministic
# simulator, which is what the batch metrics are built on. The replay lab runs against its own
# isolated simulator either way, so it stays available on a credentialled instance too.
#
# This blueprint has no database, so REQUIRE_DATABASE stays false and the instance keeps its cases
# in memory: Render is the non-durable alternative, useful for looking at the UI and nothing that
# has to survive a restart. The durable deployment attaches Postgres and sets REQUIRE_DATABASE=true.
services:
  - type: web
    name: recovery-loop
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # The app requires Node 22 (see `engines` in package.json).
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard to run Pincc-backed live diagnosis. The seeded batch always
      # uses fixtures, so this never changes the published figures.
      - key: PINCC_API_KEY
        sync: false
      - key: PINCC_MODEL
        value: claude-sonnet-5
      - key: PINCC_BASE_URL
        value: https://v2.pincc.ai
      - key: DIAGNOSIS_TIMEOUT_MS
        value: "30000"
      # No database on this plan, so the instance is explicitly allowed to run in memory.
      - key: REQUIRE_DATABASE
        value: "false"
      # Set in the Render dashboard. Without it every state-changing route is disabled.
      - key: CONTROL_PLANE_TOKEN
        sync: false
      # Set in the Render dashboard. Absent, the simulator invents a secret per process and no
      # outside caller can sign a delivery it will accept.
      - key: SIMULATOR_WEBHOOK_SECRET
        sync: false
